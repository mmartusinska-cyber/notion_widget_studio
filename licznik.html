<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Licznik</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent}.card{width:100%;padding:22px 16px;text-align:center;background:#fff;color:#252621;border:1px solid #0000000a;border-radius:17px;box-shadow:0 8px 28px #00000010}.title{font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.65;font-weight:700;margin-bottom:10px}.number{font-size:64px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}.buttons{display:flex;justify-content:center;gap:12px;margin-top:12px}.buttons button{width:54px;height:54px;border:1px solid #d8d9d4;border-radius:8px;background:#f6f6f3;color:#252621;font-size:28px;line-height:1;cursor:pointer}.buttons button:hover{background:#eaf0eb}.buttons button:focus-visible{outline:3px solid #416b58;outline-offset:2px}
</style>
</head>
<body>
<div class="card"><div class="title">Licznik</div><div class="number" id="number">0</div><div class="buttons"><button type="button" id="minus" aria-label="Zmniejsz">−</button><button type="button" id="plus" aria-label="Zwiększ">+</button></div></div>
<script>
const storageKey='notion-counter-licznik';
const numberElement=document.getElementById('number');
let value=Math.max(0,Number(localStorage.getItem(storageKey)??0));
function update(){numberElement.textContent=value;localStorage.setItem(storageKey,String(value));}
document.getElementById('minus').addEventListener('click',()=>{value=Math.max(0,value-1);update()});
document.getElementById('plus').addEventListener('click',()=>{value+=1;update()});
update();
</script>
</body>
</html>
