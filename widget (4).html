<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pogoda Warszawa</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:14px/1.45 system-ui;background:transparent}.w{width:100%;padding:18px 15px;background:#ffffff;color:#000000;border-radius:17px;border:1px solid #0000000a;box-shadow:0 8px 28px #00000010}.title{text-align:center;font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.65;font-weight:700;margin-bottom:10px}.tabs{display:flex;gap:7px;margin:3px 0 10px}.tabs button{flex:1;padding:7px;border:1px solid color-mix(in srgb,#000000 12%,transparent);border-radius:8px;background:transparent;color:inherit;font-size:12px;cursor:pointer}.tabs button.active{background:color-mix(in srgb,#ade4ff 15%,transparent);border-color:#ade4ff;font-weight:700}.list{max-height:240px;overflow:auto;scrollbar-width:thin}.row{display:grid;grid-template-columns:46px 1fr 60px 67px;gap:4px;align-items:center;padding:8px 2px;border-bottom:1px solid color-mix(in srgb,#000000 9%,transparent);font-size:12px}.hour{font-weight:700}.temp{text-align:right;font-weight:700;white-space:nowrap}.temp small{font-weight:400;opacity:.62}.meta{text-align:center;white-space:nowrap;font-size:11px}.state{text-align:center;padding:24px 5px;opacity:.7}.credit{text-align:center;font-size:10px;opacity:.52;margin-top:8px}</style></head><body><div class="w"><div id="app" class="state">Pobieram prognozę…</div><div class="credit">Warszawa · dane: Open-Meteo</div></div><script>const app=document.getElementById('app'),api='https://api.open-meteo.com/v1/forecast?latitude=52.2297&longitude=21.0122&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,cloud_cover&timezone=Europe%2FWarsaw&forecast_days=2&temperature_unit=celsius';function icon(c,n){if(c>=71&&c<=77||c>=85&&c<=86)return'❄️';if(c>=51&&c<=67||c>=80&&c<=82||c>=95)return'🌧️';return n<15?'☀️':n<55?'🌤️':'☁️'}function key(a){let p=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Warsaw'}).format(new Date()).split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+a)).toISOString().slice(0,10)}function draw(d,a){let h=d.hourly,hr=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Warsaw',hour:'2-digit',hourCycle:'h23'}).format(new Date())),r=h.time.map((t,i)=>({t,i})).filter(x=>x.t.slice(0,10)===key(a)&&(a||Number(x.t.slice(11,13))>=hr));app.className='';app.innerHTML='<div class="tabs"><button class="'+(!a?'active':'')+'" data-day="0">Dziś</button><button class="'+(a?'active':'')+'" data-day="1">Jutro</button></div><div class="list">'+(r.map(x=>'<div class="row"><span class="hour">'+x.t.slice(11,16)+'</span><span class="meta">💧 '+(h.precipitation_probability[x.i]??0)+'%</span><span class="meta">'+icon(h.weather_code[x.i]??0,h.cloud_cover[x.i]??0)+' '+Math.round(h.cloud_cover[x.i]??0)+'%</span><span class="temp">'+Math.round(h.temperature_2m[x.i])+'° <small>('+Math.round(h.apparent_temperature[x.i])+'°)</small></span></div>').join('')||'<div class="state">Brak godzinowej prognozy.</div>')+'</div>';app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>draw(d,Number(b.dataset.day)))}fetch(api).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>draw(d,0)).catch(()=>{app.className='state';app.textContent='Nie udało się pobrać prognozy. Sprawdź połączenie.'})</script></body></html>
