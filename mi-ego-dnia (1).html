<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miłego dnia</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui;background:transparent}.w{width:100%;padding:22px 16px;text-align:center;background:#ffffff;color:#000000;border-radius:17px;border:1px solid #0000000a;box-shadow:0 8px 28px #00000010}.title{font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.65;font-weight:700;margin-bottom:10px}.n{font-size:64px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}.buttons{display:flex;justify-content:center;gap:12px;margin-top:12px}.buttons button{width:54px;height:54px;border:1px solid color-mix(in srgb,#000000 18%,transparent);border-radius:9px;background:color-mix(in srgb,#000000 5%,transparent);color:#000000;font-size:28px;line-height:1;cursor:pointer}</style></head><body><div class="w"><div class="title">Miłego dnia</div><div class="n" id="n">0</div><div class="buttons"><button aria-label="Zmniejsz" id="minus">−</button><button aria-label="Zwiększ" id="plus">+</button></div></div><script>const k='notion-counter-mi-ego-dnia',n=document.getElementById('n');let v=Math.max(0,Number(localStorage.getItem(k)??0));function show(){n.textContent=v;localStorage.setItem(k,v)}document.getElementById('plus').onclick=()=>{v++;show()};document.getElementById('minus').onclick=()=>{v=Math.max(0,v-1);show()};show()</script></body></html>
